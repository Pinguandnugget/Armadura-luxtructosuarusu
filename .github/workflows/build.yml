name: Compilar Luxtructosaurus 1.21.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar con registros detallados
        run: gradle --no-daemon build --stacktrace
      - name: Guardar JAR compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Luxtructosaurus-Fabric-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
